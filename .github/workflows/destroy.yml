# Destroy the lab (workspace stack first, then platform). Bootstrap (state,
# identities, budget, the empty lab RG) is never touched.
#
# Triggers:
#   workflow_dispatch  type "destroy" to confirm. Ignores the keep-alive.
#   schedule           nightly safety net, 07:00 UTC = 03:00 EDT / 02:00 EST
#                      (GitHub cron is UTC and best effort; it can run late).
#
# Interview-week keep-alive: set the repo variable LAB_KEEP_ALIVE_UNTIL to a
# date (YYYY-MM-DD, America/New_York). The NIGHTLY run skips while today is on
# or before that date. Dates more than 7 days ahead are ignored on purpose, so
# a typo can't keep the lab up for a month. Delete the variable afterwards.
#
#   gh variable set LAB_KEEP_ALIVE_UNTIL --body 2026-10-16
#   gh variable delete LAB_KEEP_ALIVE_UNTIL
#
# Heads-up: GitHub disables scheduled workflows in public repos after 60 days
# with no repo activity. The $25 budget alert is the backstop.
#
# Environment `lab-destroy` has NO required reviewer (a safety net that waits
# for approval isn't one) and only main can use it.

name: Destroy

on:
  # checkov:skip=CKV_GHA_7:Not a build. The only input is a typed confirmation, passed via env and compared to a literal; it never reaches a command or Terraform.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to tear the lab down now'
        required: true
        type: string
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

# Concurrency is on the destroy JOB (below), not the workflow, so `decide` and
# `cancel-pending-deploys` can run while a deploy holds the lock.

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.5"

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Keep-alive, confirmation and configuration checks
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
          KEEP_ALIVE_UNTIL: ${{ vars.LAB_KEEP_ALIVE_UNTIL }}
          CONFIGURED: ${{ vars.AZURE_CLIENT_ID_APPLY != '' && vars.TFSTATE_STORAGE_ACCOUNT != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}
        run: |
          proceed=true
          if [ "$CONFIGURED" != "true" ]; then
            echo "::notice title=Nothing to destroy::Azure repo variables aren't set (bootstrap not done yet)."
            proceed=false
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$CONFIRM" != "destroy" ]; then
              echo "::error::Confirmation must be exactly \"destroy\"."
              exit 1
            fi
          elif [ -n "$KEEP_ALIVE_UNTIL" ]; then
            today=$(TZ=America/New_York date +%F)
            max=$(TZ=America/New_York date -d "+7 days" +%F)
            if ! [[ "$KEEP_ALIVE_UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -d "$KEEP_ALIVE_UNTIL" > /dev/null 2>&1; then
              echo "::warning title=Keep-alive ignored::LAB_KEEP_ALIVE_UNTIL isn't a YYYY-MM-DD date. Destroying."
            elif [[ "$KEEP_ALIVE_UNTIL" > "$max" ]]; then
              echo "::warning title=Keep-alive ignored::LAB_KEEP_ALIVE_UNTIL is more than 7 days ahead (max $max). Destroying."
            elif [[ "$KEEP_ALIVE_UNTIL" < "$today" ]]; then
              echo "::notice title=Keep-alive expired::LAB_KEEP_ALIVE_UNTIL ($KEEP_ALIVE_UNTIL) has passed. Destroying; delete the variable."
            else
              echo "::notice title=Keep-alive::Skipping the nightly destroy: keep-alive until $KEEP_ALIVE_UNTIL (ET)."
              echo "### Nightly destroy skipped: keep-alive until $KEEP_ALIVE_UNTIL" >> "$GITHUB_STEP_SUMMARY"
              proceed=false
            fi
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  # A deploy that nobody approved would otherwise sit in the `lab-env` group
  # (its apply job waits on the `lab` reviewer for up to 30 days) and block
  # the safety net. Cancel deploy runs that are waiting for approval or
  # queued. A deploy that is actually applying is left alone; the destroy job
  # queues behind it and runs when it finishes.
  cancel-pending-deploys:
    name: Cancel unapproved/queued deploys
    needs: decide
    if: needs.decide.outputs.proceed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # cancel workflow runs; this job only
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cancel waiting / queued / pending deploy runs
        run: |
          ids=$(for s in waiting queued pending requested; do
                  gh run list --workflow deploy.yml --status "$s" --limit 50 --json databaseId --jq '.[].databaseId'
                done | sort -u)
          if [ -z "$ids" ]; then
            echo "No waiting or queued deploy runs."
            exit 0
          fi
          for id in $ids; do
            echo "Cancelling deploy run $id"
            gh run cancel "$id" || echo "::warning::Couldn't cancel run $id (it may have just finished)."
          done
          echo "### Cancelled unapproved/queued deploy runs: $(echo "$ids" | wc -w)" >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy (workspace -> platform)
    needs: [decide, cancel-pending-deploys]
    if: needs.decide.outputs.proceed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: lab-destroy
    # Shared with deploy.yml's apply job. A pending destroy is never cancelled
    # by a newer run (queue: max), and an in-flight destroy is never cancelled
    # (cancel-in-progress: false).
    concurrency:
      group: lab-env
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write # OIDC -> id-gh-dbxlab-apply
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_APPLY }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_lab_admin: ${{ vars.LAB_ADMIN || 'unused-for-destroy@example.com' }}
      DATABRICKS_AUTH_TYPE: github-oidc-azure
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - name: Mask identifiers
        run: |
          echo "::add-mask::$ARM_TENANT_ID"
          echo "::add-mask::$ARM_SUBSCRIPTION_ID"
          echo "::add-mask::$ARM_CLIENT_ID"
          echo "::add-mask::$TF_VAR_lab_admin"
          echo "started=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init (both stacks)
        run: |
          for d in platform workspace; do
            terraform -chdir="infra/$d" init -lockfile=readonly -no-color \
              -backend-config="resource_group_name=rg-dbxlab-state" \
              -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
              -backend-config="container_name=tfstate"
          done

      - name: Anything deployed?
        id: state
        run: |
          p=$(terraform -chdir=infra/platform state list | wc -l)
          w=$(terraform -chdir=infra/workspace state list | wc -l)
          echo "platform=$p" >> "$GITHUB_OUTPUT"
          echo "workspace=$w" >> "$GITHUB_OUTPUT"
          echo "Resources in state: platform=$p workspace=$w"
          if [ "$p" = "0" ] && [ "$w" = "0" ]; then
            echo "### Nothing deployed; nothing to destroy" >> "$GITHUB_STEP_SUMMARY"
          fi

      # UC objects must go BEFORE the workspace, or the external location is
      # orphaned in the long-lived metastore and blocks the next apply.
      - name: terraform destroy (workspace)
        if: steps.state.outputs.workspace != '0'
        run: |
          .github/scripts/write-platform-tfvars.sh
          t0=$(date +%s)
          terraform -chdir=infra/workspace destroy -auto-approve -lock-timeout=5m -no-color > destroy.log 2>&1 || { tail -n 60 destroy.log; exit 1; }
          grep -E '^Destroy complete' destroy.log || true
          echo "workspace_seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      # VNet-injected workspaces sometimes leave subnet delegations or
      # managed-RG locks that clear a few minutes later: one retry.
      - name: terraform destroy (platform)
        if: steps.state.outputs.platform != '0'
        run: |
          t0=$(date +%s)
          for attempt in 1 2; do
            if terraform -chdir=infra/platform destroy -auto-approve -lock-timeout=5m -no-color > destroy.log 2>&1; then
              grep -E '^Destroy complete' destroy.log || true
              echo "platform_seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
              exit 0
            fi
            tail -n 60 destroy.log
            if [ "$attempt" = "1" ]; then echo "Destroy failed; retrying in 5 minutes."; sleep 300; fi
          done
          echo "::error::Platform destroy failed twice. Resources may still be billing: check rg-dbxlab-eus2 in the portal."
          exit 1

      - name: Verify state is empty
        if: steps.state.outputs.platform != '0' || steps.state.outputs.workspace != '0'
        run: |
          left=$(( $(terraform -chdir=infra/platform state list | wc -l) + $(terraform -chdir=infra/workspace state list | wc -l) ))
          if [ "$left" != "0" ]; then
            echo "::error::$left resources still in state after destroy."
            exit 1
          fi

      - name: Record timings
        if: always()
        run: |
          fmt() { [ -n "${1:-}" ] && printf '%dm %02ds' $(( $1 / 60 )) $(( $1 % 60 )) || echo "n/a"; }
          {
            echo "### Destroy timings"
            echo
            echo "| Step | Duration |"
            echo "|---|---|"
            echo "| workspace destroy | $(fmt "${workspace_seconds:-}") |"
            echo "| platform destroy | $(fmt "${platform_seconds:-}") |"
            echo "| whole job | $(fmt "$(( $(date +%s) - started ))") |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Destroy timings::workspace destroy $(fmt "${workspace_seconds:-}"), platform destroy $(fmt "${platform_seconds:-}"), job $(fmt "$(( $(date +%s) - started ))")"
